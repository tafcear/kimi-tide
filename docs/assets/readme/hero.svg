<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">kimi-tide 月汐 — DSH 模型路由插件</title>
  <desc id="desc">月汐 hero：左侧项目名与一句话价值，右侧潮汐分流决策图——消息经决策点分流到 Kimi 或 DeepSeek，每个决策留痕。</desc>

  <rect width="1200" height="340" rx="26" fill="#0B1B2B"/>

  <!-- 潮汐背景：两条轻浪，来自项目名意象 -->
  <path d="M 0 296 C 100 286, 200 306, 300 296 S 500 286, 600 296 S 800 306, 900 296 S 1100 286, 1200 296"
        fill="none" stroke="#1E5A8A" stroke-width="2" opacity="0.55"/>
  <path d="M 0 314 C 100 304, 200 324, 300 314 S 500 304, 600 314 S 800 324, 900 314 S 1100 304, 1200 314"
        fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity="0.28"/>

  <!-- 左：标题区（58%） -->
  <g id="title-block" transform="translate(56 62)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="3" fill="#5B7A93">DSH MODEL ROUTER</text>
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="72" font-weight="700" fill="#E6F3FF">kimi-tide</text>
    <text x="368" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="44" font-weight="600" fill="#7DD3FC">月汐</text>
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="30" fill="#E6F3FF">每步自动选模型，每个决策看得见</text>
    <!-- 徽章行（shields 双色胶囊样式） -->
    <g id="badges" transform="translate(0 162)">
      <rect x="0" y="0" width="139" height="28" rx="4" fill="#555555"/>
      <path d="M 98 0 H 135 A 4 4 0 0 1 139 4 V 24 A 4 4 0 0 1 135 28 H 98 Z" fill="#3178C6"/>
      <text x="49" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">TypeScript</text>
      <text x="118" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">5.6</text>

      <rect x="149" y="0" width="116" height="28" rx="4" fill="#555555"/>
      <path d="M 223 0 H 261 A 4 4 0 0 1 265 4 V 24 A 4 4 0 0 1 261 28 H 223 Z" fill="#97CA00"/>
      <text x="186" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">License</text>
      <text x="244" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">MIT</text>

      <rect x="275" y="0" width="141" height="28" rx="4" fill="#555555"/>
      <path d="M 349 0 H 412 A 4 4 0 0 1 416 4 V 24 A 4 4 0 0 1 412 28 H 349 Z" fill="#007EC6"/>
      <text x="312" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">Release</text>
      <text x="382" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">v0.5.0</text>

      <rect x="426" y="0" width="133" height="28" rx="4" fill="#555555"/>
      <path d="M 484 0 H 555 A 4 4 0 0 1 559 4 V 24 A 4 4 0 0 1 555 28 H 484 Z" fill="#4CBB17"/>
      <text x="455" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">Tests</text>
      <text x="521" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">209/209</text>
    </g>
  </g>

  <!-- 右：潮汐分流决策图（42%） -->
  <g id="project-proof" transform="translate(690 64)">
    <!-- 输入：消息 -->
    <rect x="0" y="24" width="120" height="56" rx="12" fill="#0F2436" stroke="#1E5A8A" stroke-width="1.5"/>
    <text x="60" y="59" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" fill="#E6F3FF">消息</text>

    <!-- 决策点（琥珀菱形） -->
    <rect x="180" y="28" width="48" height="48" rx="6" fill="#211708" stroke="#F59E0B" stroke-width="1.5"
          transform="rotate(45 204 52)"/>
    <text x="204" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18" fill="#F59E0B">决策</text>

    <!-- 分流线 -->
    <path d="M 120 52 L 180 52" stroke="#5B7A93" stroke-width="1.5" fill="none"/>
    <path d="M 228 52 C 280 52, 280 6, 320 6" stroke="#7DD3FC" stroke-width="1.5" fill="none"/>
    <path d="M 228 52 C 280 52, 280 116, 320 116" stroke="#1E5A8A" stroke-width="2" fill="none"/>

    <!-- 上支：Kimi -->
    <rect x="320" y="-24" width="150" height="60" rx="12" fill="#10233A" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="395" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" fill="#E6F3FF">Kimi · k3</text>
    <text x="395" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#7DD3FC">多模态 · 1M</text>

    <!-- 下支：DeepSeek -->
    <rect x="320" y="86" width="150" height="60" rx="12" fill="#0F2436" stroke="#1E5A8A" stroke-width="1.5"/>
    <text x="395" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" fill="#E6F3FF">DeepSeek · v4</text>
    <text x="395" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#6B9AC0">便宜 · 1M</text>

    <!-- 决策留痕 chip -->
    <rect x="149" y="122" width="110" height="28" rx="14" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="204" y="141" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="14" fill="#F59E0B">留痕 · 理由</text>

    <!-- 规则徽章：项目核心内容（预设+规则） -->
    <g id="rule-badges" transform="translate(0 178)">
      <rect x="0" y="0" width="186" height="28" rx="4" fill="#555555"/>
      <path d="M 88 0 H 182 A 4 4 0 0 1 186 4 V 24 A 4 4 0 0 1 182 28 H 88 Z" fill="#155E75"/>
      <text x="44" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">带图 / 代码</text>
      <text x="137" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">→ Kimi · k3</text>

      <rect x="196" y="0" width="176" height="28" rx="4" fill="#555555"/>
      <path d="M 242 0 H 368 A 4 4 0 0 1 372 4 V 24 A 4 4 0 0 1 368 28 H 242 Z" fill="#1E5A8A"/>
      <text x="219" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">兜底</text>
      <text x="307" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#FFFFFF">→ DeepSeek · v4</text>
    </g>
  </g>
</svg>
