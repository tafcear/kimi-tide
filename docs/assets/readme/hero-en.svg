<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">kimi-tide — per-step model router for DSH: any mounted model, routed by your rules</title>
  <desc id="desc">kimi-tide hero: the project name and one-line value on the left; on the right an open fan-out diagram — one message passes a decision point and routes to Kimi, DeepSeek, or any mounted provider/model, with rule chips and a decision-trail marker.</desc>

  <rect width="1200" height="340" rx="26" fill="#0B1B2B"/>

  <!-- tide background: two light waves from the project-name motif -->
  <path d="M 0 306 C 100 296, 200 316, 300 306 S 500 296, 600 306 S 800 316, 900 306 S 1100 296, 1200 306"
        fill="none" stroke="#1E5A8A" stroke-width="2" opacity="0.55"/>
  <path d="M 0 324 C 100 314, 200 334, 300 324 S 500 314, 600 324 S 800 334, 900 324 S 1100 314, 1200 324"
        fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity="0.28"/>

  <!-- left: title block (58%) -->
  <g id="title-block" transform="translate(56 66)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="3" fill="#5B7A93">DSH · PER-STEP MODEL ROUTER</text>
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="72" font-weight="700" fill="#E6F3FF">kimi-tide</text>
    <text x="348" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="44" font-weight="600" fill="#7DD3FC">月汐</text>
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="30" fill="#E6F3FF">Every step routed, every decision explained</text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="22" fill="#9CC3E0">Any mounted model, routed by your rules</text>
    <!-- principle microcopy -->
    <g id="principles" transform="translate(0 214)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="16" fill="#5B7A93">
      <text x="0" y="0">presets + rules + @directives</text>
      <text x="0" y="26">candidate pool = every mounted model · no whitelist</text>
    </g>
  </g>

  <!-- right: open fan-out (42%) — one message → decision point → N provider channels -->
  <g id="project-proof" transform="translate(700 34)">
    <!-- input: message -->
    <rect x="0" y="86" width="118" height="56" rx="12" fill="#0F2436" stroke="#1E5A8A" stroke-width="1.5"/>
    <text x="59" y="121" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" fill="#E6F3FF">message</text>

    <!-- decision point (amber diamond) -->
    <rect x="172" y="90" width="48" height="48" rx="6" fill="#211708" stroke="#F59E0B" stroke-width="1.5"
          transform="rotate(45 196 114)"/>
    <text x="196" y="119" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="17" fill="#F59E0B">route</text>

    <!-- fan-out lines: two solid (example providers) + one dashed (open pool) -->
    <path d="M 118 114 L 172 114" stroke="#5B7A93" stroke-width="1.5" fill="none"/>
    <g id="flow-lines">
      <path d="M 220 114 C 264 114, 262 28, 306 28" stroke="#7DD3FC" stroke-width="1.5" fill="none"/>
      <path d="M 220 114 C 264 114, 262 100, 306 100" stroke="#1E5A8A" stroke-width="2" fill="none"/>
      <path d="M 220 114 C 264 114, 262 172, 306 172" stroke="#9CC3E0" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/>
    </g>

    <!-- channel 1: Kimi (example, multimodal) -->
    <g id="ch-1">
      <rect x="306" y="-2" width="176" height="60" rx="12" fill="#10233A" stroke="#7DD3FC" stroke-width="1.5"/>
      <text x="394" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="20" fill="#E6F3FF">kimi-coding · k3</text>
      <text x="394" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#7DD3FC">multimodal · 1M</text>
    </g>

    <!-- channel 2: DeepSeek (example, text-only) -->
    <g id="ch-2">
      <rect x="306" y="70" width="176" height="60" rx="12" fill="#0F2436" stroke="#1E5A8A" stroke-width="1.5"/>
      <text x="394" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="20" fill="#E6F3FF">deepseek · v4-flash</text>
      <text x="394" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#6B9AC0">text · 1M · cheap</text>
    </g>

    <!-- channel 3: open candidate pool (dashed = any mounted model) -->
    <g id="ch-3">
      <rect x="306" y="142" width="176" height="60" rx="12" fill="#0B1B2B" stroke="#9CC3E0" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="394" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="20" fill="#9CC3E0">any provider</text>
      <text x="394" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#5B7A93">any mounted model</text>
    </g>

    <!-- rule chips: the project's core content (presets + rules + @directives) -->
    <g id="rule-chips" transform="translate(-8 224)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
       font-size="16" fill="#E6F3FF">
      <rect x="0" y="0" width="86" height="30" rx="15" fill="#10233A" stroke="#7DD3FC" stroke-width="1.2"/>
      <text x="43" y="20" text-anchor="middle">@explicit</text>
      <rect x="96" y="0" width="162" height="30" rx="15" fill="#10233A" stroke="#7DD3FC" stroke-width="1.2"/>
      <text x="177" y="20" text-anchor="middle">image → multimodal</text>
      <rect x="268" y="0" width="142" height="30" rx="15" fill="#10233A" stroke="#1E5A8A" stroke-width="1.2"/>
      <text x="339" y="20" text-anchor="middle">keyword → rule</text>
      <rect x="420" y="0" width="74" height="30" rx="15" fill="none" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="457" y="20" text-anchor="middle" fill="#F59E0B">trail</text>
    </g>
  </g>
</svg>
