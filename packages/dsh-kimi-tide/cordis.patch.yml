# Bundle patch layer for dsh-kimi-tide (月汐).
# Applied when a profile lists this bundle (dsh plugin --profile <name> add .).
# A patch replaces a row's whole config; rows are addressed by id, later
# layers win. 0.4.x: the plugin owns NO access-layer code — Kimi models arrive
# via the llm-pi-ai `kimi-coding` route (Settings → Models) with an API key;
# this row only carries the router/panel knobs.
- insert:
    - id: dsh-kimi-tide
      name: dsh-kimi-tide
      # Keep `config` an explicit empty map: a bare `config:` key whose children
      # are all comments composes as YAML null, which crashes plugin loaders
      # that read config properties (PR #3, live desktop incident 2026-08-21).
      config: {}
      # Optional knobs (nest under `config` to enable):
      #   usagePollMs: 60000      # quota poll period (月汐 dock)
      #   usagePollOnStart: true  # poll quota on startup
      #   maxConsecutiveToolFailures: 20  # 连续失败工具守卫（0.7.0 兜底，B 方案）：一轮内连续 N 次工具
      #                                   # isError 且无成功 → 阻断本轮（agent/pre-step reject）；≤0 关闭。缺省 20。
      #   router:                 # legacy static seed (v1 vocabulary, auto-migrated to the v4
      #                           # preset/rule shape); the 月汐 settings card owns the live config
      #                           # (or /kimi-tide preset <id|off>)
