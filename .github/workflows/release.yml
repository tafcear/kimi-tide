name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动入口（2026-10-10 加）：用来**在 npm 侧配置 Trusted Publisher 之后、不发新版的前提下**
  # 验证整条发布链路——拿一个已有的 tag 触发，工作流的「手动 tag 校验」步会要求
  # tag 版本 == package.json 版本，已存在的 Release 与已发布的 npm 版本都会走幂等分支，
  # 不会误发。
  workflow_dispatch:
    inputs:
      tag:
        description: '用于验证的已存在 tag（必须与 package.json 版本一致，如 v2.2.2）'
        required: true
        type: string

permissions:
  contents: write
  # npm Trusted Publishing（OIDC）：发布步骤用 GitHub 的 id token 向 npm 换短期凭据，
  # 仓库里**不再需要任何长期 NPM_TOKEN**（npm 已宣布 2027-01 起停用经典 token）。
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # GH_TOKEN 放在**作业级**：发布 Release 与后面读 Release 资产 digest 的校验步都要用。
    # 2026-10-10 实跑踩到：校验步漏了 token ⇒ `gh api` 静默失败 ⇒ 拿到空 digest、
    # 报出「本地打包与资产 digest 不一致」这种**假红**（run 38034664120）。
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 2026-10-10 改动：**不要再在 job 级 env 里覆盖 GITHUB_REF_NAME**——它是 GitHub
      # 预定义变量，作业级同名 env 覆盖不生效（实测：手动运行里它仍是 `main`，
      # 「手动 tag 校验」步因此必然失败）。改为在第一步显式解析出本次要发的 tag，
      # 写进 GITHUB_ENV 供后续所有步骤使用：自动触发用 github.ref_name；手动触发用输入值。
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag 必须以 v 开头（收到：$TAG）"; exit 1 ;;
          esac
          echo "KT_TAG=$TAG" >> "$GITHUB_ENV"
          echo "KT_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "本次要发的 tag：$TAG"
      - uses: actions/checkout@v4
        with:
          # 手动运行默认落在 main；要打的是 tag 那棵树，所以显式检出 tag。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Verify manual tag matches package.json
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          P="$(node -p "require('./packages/dsh-kimi-tide/package.json').version")"
          if [ "$KT_VERSION" != "$P" ]; then
            echo "::error::手动触发的 tag（$KT_TAG=$KT_VERSION）与 package.json（$P）不一致——拒绝运行，避免误发"
            exit 1
          fi
          echo "手动验证运行：tag=$KT_TAG 与 package.json $P 一致"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 2026-10-10：Trusted Publishing 要求较新的 npm（旧版没有 OIDC 发布路径），runner
      # 自带的 npm 10 偏旧 ⇒ 发布前强制升到最新，避免「本地能发、CI 报 401/404」。
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
        working-directory: packages/dsh-kimi-tide
      - name: Build
        working-directory: packages/dsh-kimi-tide
        run: npm run build
      - name: Test
        working-directory: packages/dsh-kimi-tide
        run: npm test
      - name: Version consistency check
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./packages/dsh-kimi-tide/package.json').version")"
          if [ "$KT_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v${KT_VERSION} != package.json ${PKG_VERSION}" >&2
            exit 1
          fi
      - name: Bundle-patch field guard
        shell: bash
        run: |
          node -e "
            const p = require('./packages/dsh-kimi-tide/package.json');
            if (!p.dsh?.bundle?.patch) { console.error('dsh.bundle.patch missing'); process.exit(1); }
          "
      - name: Pack
        working-directory: packages/dsh-kimi-tide
        run: |
          set -euo pipefail
          # 打一次包，把**文件名**与 **sha256** 记进环境/临时文件：后面「GitHub 资产 ↔
          # npm 侧」逐字节比对要用它（2026-10-10 起两渠道同源：npm 发布也走 CI，而 CI 是
          # LF 检出）。用 grep 取 .tgz 行而不用 basename——npm 的提示行在 Windows 上带
          # 反斜杠，basename 会切错。
          OUT="$(npm pack --silent)"
          PKG="$(printf '%s\n' "$OUT" | grep -E '\.tgz$' | tail -n 1 | tr -d '\r')"
          test -f "$PKG" || { echo "::error::npm pack 未产出 tgz（输出：$OUT）"; exit 1; }
          echo "PKG_NAME=$PKG" >> "$GITHUB_ENV"
          sha256sum "$PKG" | awk '{print $1}' > /tmp/pack-sha256.txt
          echo "打包完成：$PKG（sha256 $(cat /tmp/pack-sha256.txt)）"
      - name: Export annotated tag notes
        shell: bash
        working-directory: packages/dsh-kimi-tide
        run: |
          # 更新说明 = 附注 tag 消息（发版约定 = git tag -a，消息写四段式正文；
          # 2026-08-23 前为固定模板句——Release 页长期只有「构建/测试通过」
          # 一行的根因）。v1.0.0 发版实测三坑存档：
          # ① 新版 gh 禁止 --notes-from-tag 与 --repo 组合——不要带 --repo；
          # ② actions/checkout 把 tag push 的同名 tag 落成「指向提交的轻量
          #    tag」（不取附注对象），gh --notes-from-tag 从本地读到的是
          #    提交消息而非附注——v1.0.0 Release 正文变成 CI 提交消息的根因；
          # ③ 本地已有同名 tag 后再 git fetch 同名 tag 会报 would clobber
          #    （对象不同被拒）——所以要拿附注必须 --force 重取 tag 对象。
          # 因此：--force 取回附注 → 导出附注为 notes 文件 → --notes-file
          #（不依赖 gh 对本地 tag 状态的任何假设）。
          set -euo pipefail
          git fetch origin tag "$KT_TAG" --force
          git tag -l "$KT_TAG" --format='%(contents)' > release-notes.md
          # 附注取不到时**立刻停**：空正文会被下一步的正文门禁拦下，但拦下之前已经跑过
          # 打包，日志会误导人；这里把根因（轻量 tag / 没推到 origin）说清。
          if [ ! -s release-notes.md ]; then
            echo "::error::取不到 $KT_TAG 的附注消息（轻量 tag？还是没推到 origin？）"
            exit 1
          fi
          echo "附注消息 $(wc -c < release-notes.md) 字节"
      - name: Release notes bilingual four-section gate
        shell: bash
        run: |
          # Release 正文「双语 × 四段式」门禁（规则：docs/agents/release-notes.md）：
          # 中文整块 + English 整块，各自 ① 一句话定位 ② 本次更新/What's new
          # ③ 安装与升级/Install & upgrade ④ 验证与验收/Verification & acceptance
          # ——不合规就停在 gh release create 之前，避免发布一个说明不全的版本页。
          # 注意：正文文件由「Export annotated tag notes」步导出到
          # packages/dsh-kimi-tide/release-notes.md（该步的 working-directory），
          # 本步从仓库根以相对路径引用。
          node scripts/check-release-notes.mjs --file packages/dsh-kimi-tide/release-notes.md --version "$KT_VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/dsh-kimi-tide
        run: |
          set -euo pipefail
          # 幂等：Release 已存在（手动验证运行 / 重跑）时不重复创建。
          if gh release view "$KT_TAG" >/dev/null 2>&1; then
            echo "Release $KT_TAG 已存在，跳过创建（幂等）"
            # 手动验证运行会走这里：此时 CI 打出的包与**当初发布的那份**未必逐字节相同
            # （v2.2.2 的资产是维护者本机 CRLF 工作树打的，而 CI 是 LF 检出）。所以下面的
            # 「本地打包 == 资产 digest」断言只对**本次真的创建了 Release**的运行有意义，
            # 这里显式标注为跳过，避免又一次假红。
            echo "DIGEST_ASSERT=skip" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "DIGEST_ASSERT=on" >> "$GITHUB_ENV"
          # 额外产出稳定名资产（dsh-kimi-tide.tgz）：awesome-dsh-plugin 收录
          # 条目的 tarball 字段指向 releases/latest/download/ 稳定名链接，
          # 版本号文件名会在下个发布后 404。
          cp dsh-kimi-tide-*.tgz dsh-kimi-tide.tgz
          gh release create "$KT_TAG" \
            --title "dsh-kimi-tide v${KT_VERSION}" \
            --notes-file release-notes.md \
            dsh-kimi-tide-*.tgz dsh-kimi-tide.tgz
      # ---- npm 渠道（2026-10-10 起并入 CI）------------------------------------------
      # 为什么搬进来：此前 npm 是维护者在本机手发，而本机 `core.autocrlf=true`、仓库又
      # 没有 .gitattributes ⇒ `npm pack` 打的是 CRLF 的工作树，CI 打的是 LF 检出，
      # 于是 v2.2.0／v2.2.2 两轮都出现「两渠道有 4 个文件仅行尾不同」的可复现性缺口。
      # 搬进 CI 后：**同一棵树、同一次打包、同一个 tgz** 既做 Release 资产又发 npm。
      # 认证走 Trusted Publishing（OIDC），不需要 NPM_TOKEN。
      - name: Publish to npm (trusted publishing)
        working-directory: packages/dsh-kimi-tide
        run: |
          set -euo pipefail
          # 幂等：tag 重推 / 重跑该工作流时，已发布的版本直接跳过，不制造失败。
          if npm view "dsh-kimi-tide@$KT_VERSION" version >/dev/null 2>&1; then
            echo "npm 上已有 dsh-kimi-tide@$KT_VERSION，跳过发布（幂等）"
            exit 0
          fi
          # Trusted Publisher 没配好时该怎么办：**不猜字段、看真实结果**。GitHub Release
          # 已经发出去了，此时因为 npm 侧配置缺失而让整个流水线翻红，会给人「发版失败」的
          # 错觉——所以把「认得出的未配置/无凭据」类失败降级为警告（发版照旧算成功），别的
          # 失败照旧硬失败。配置位置：npmjs.com → 该包 Settings → Trusted Publisher；
          # 绑定 Repository = <owner>/<repo>、Workflow = release.yml。
          set +e
          PUB_OUT="$(npm publish "./$PKG_NAME" --provenance --tag latest --registry https://registry.npmjs.org/ 2>&1)"
          PUB_CODE=$?
          set -e
          printf '%s\n' "$PUB_OUT"
          if [ $PUB_CODE -ne 0 ]; then
            if printf '%s' "$PUB_OUT" | grep -qiE 'ENEEDAUTH|not authenticated|401|403|trusted publisher|Two-factor|OTP'; then
              echo "::warning::npm 渠道未发布：npm 侧还没把 Trusted Publisher 配到本仓库（包 Settings → Trusted Publisher：Repository=${GITHUB_REPOSITORY}、Workflow=release.yml）。GitHub Release 已正常发出，配好后下个 tag 自动接管 npm 渠道。"
              echo "NPM_PUBLISHED=0" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::npm publish 失败（非配置类原因，退出码 $PUB_CODE）"
            exit 1
          fi
          echo "NPM_PUBLISHED=1" >> "$GITHUB_ENV"
      - name: Verify both channels share one tarball
        working-directory: packages/dsh-kimi-tide
        run: |
          set -euo pipefail
          LOCAL_SHA="$(cat /tmp/pack-sha256.txt)"
          # ① GitHub 侧：走 gh api 本地镜像比对（--repo 等价），失败重试 3 次
          GH_DIGEST=""
          for i in 1 2 3; do
            GH_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${KT_TAG}" \
              --jq ".assets[] | select(.name == \"dsh-kimi-tide-${KT_VERSION}.tgz\") | .digest" 2>/dev/null || true)"
            [ -n "$GH_DIGEST" ] && break
            sleep 5
          done
          echo "本地打包 : $LOCAL_SHA"
          echo "GitHub 侧: $GH_DIGEST"
          # 本地打包 == 发出去的 tgz == GitHub 资产 digest 应逐字一致——但**只在本次真的
          # 创建了 Release 时**才成立：手动验证运行拿到的是历史资产（可能是另一台机器、
          # 另一种行尾打出来的），那时该断言没有意义（见上一步的 DIGEST_ASSERT）。
          if [ "${DIGEST_ASSERT:-on}" = "skip" ]; then
            echo "Release 已存在（手动验证运行）⇒ 跳过「本地打包 == 资产 digest」断言；本次 CI 打包 sha256 = $LOCAL_SHA"
          elif [ "sha256:$LOCAL_SHA" != "$GH_DIGEST" ]; then
            echo "::error::本地打包与 GitHub 资产 digest 不一致（打包后到上传之间被改动过？）"
            exit 1
          else
            echo "✅ 本地打包与 GitHub 资产 digest 一致"
          fi
          # ② 跨渠道比对只在**本次真的发了 npm** 时才做（未配置 Trusted Publisher 或该版本
          #    已存在时跳过）。
          if [ "${NPM_PUBLISHED:-0}" != "1" ]; then
            echo "本次未发 npm（Trusted Publisher 未配置或该版本已存在）⇒ 跳过跨渠道比对"
            exit 0
          fi
          # ③ npm 侧：Trusted Publishing 是异步受理（本地实测 PUT 202，约 3 分钟才可查），
          #    轮询等待可见（最多约 5 分钟）。取它给的 tarball 并实测 sha256。
          NPM_SHA=""
          for i in $(seq 1 20); do
            NPM_URL="$(npm view "dsh-kimi-tide@$KT_VERSION" dist.tarball 2>/dev/null || true)"
            if [ -n "$NPM_URL" ]; then
              curl -fsSL "$NPM_URL" -o /tmp/npm-side.tgz 2>/dev/null || true
              if [ -s /tmp/npm-side.tgz ]; then
                NPM_SHA="$(sha256sum /tmp/npm-side.tgz | awk '{print $1}')"
                break
              fi
            fi
            sleep 15
          done
          if [ -z "$NPM_SHA" ]; then
            echo "::error::npm 侧 $KT_VERSION 在等待 5 分钟后仍不可见"
            exit 1
          fi
          echo "npm 侧   : $NPM_SHA"
          if [ "$LOCAL_SHA" != "$NPM_SHA" ]; then
            echo "::error::npm 侧 tarball 与 GitHub 侧 sha256 不一致——两渠道不再同源，请查 npm publish 路径"
            exit 1
          fi
          echo "✅ 两渠道同一份 tarball（sha256 $LOCAL_SHA）"
