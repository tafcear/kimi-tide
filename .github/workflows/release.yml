name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: packages/dsh-kimi-tide
      - name: Build
        working-directory: packages/dsh-kimi-tide
        run: npm run build
      - name: Test
        working-directory: packages/dsh-kimi-tide
        run: npm test
      - name: Version consistency check
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/dsh-kimi-tide/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v${TAG_VERSION} != package.json ${PKG_VERSION}" >&2
            exit 1
          fi
      - name: Bundle-patch field guard
        shell: bash
        run: |
          node -e "
            const p = require('./packages/dsh-kimi-tide/package.json');
            if (!p.dsh?.bundle?.patch) { console.error('dsh.bundle.patch missing'); process.exit(1); }
          "
      - name: Pack
        working-directory: packages/dsh-kimi-tide
        run: npm pack
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/dsh-kimi-tide
        run: |
          # --notes-from-tag：附注 tag 消息即 Release 更新说明（发版约定 =
          # git tag -a，消息写更新要点）。2026-08-23 前为固定模板句——Release
          # 页长期只有「构建/测试通过」一行的根因。
          # 2026-08-29 v1.0.0 发版实测两连败：①新版 gh 禁止 --notes-from-tag
          # 与 --repo 组合——去掉 --repo（repo 从 checkout origin 推断）；
          # ②checkout 在 tag push 时已随行提供 tag 对象——切勿再 git fetch
          # 同名 tag（would clobber existing tag 秒败）。
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-kimi-tide v${GITHUB_REF_NAME#v}" \
            --notes-from-tag \
            dsh-kimi-tide-*.tgz
