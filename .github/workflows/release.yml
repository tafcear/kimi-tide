name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: packages/dsh-kimi-tide
      - name: Build
        working-directory: packages/dsh-kimi-tide
        run: npm run build
      - name: Test
        working-directory: packages/dsh-kimi-tide
        run: npm test
      - name: Version consistency check
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/dsh-kimi-tide/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v${TAG_VERSION} != package.json ${PKG_VERSION}" >&2
            exit 1
          fi
      - name: Bundle-patch field guard
        shell: bash
        run: |
          node -e "
            const p = require('./packages/dsh-kimi-tide/package.json');
            if (!p.dsh?.bundle?.patch) { console.error('dsh.bundle.patch missing'); process.exit(1); }
          "
      - name: Pack
        working-directory: packages/dsh-kimi-tide
        run: npm pack
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/dsh-kimi-tide
        run: |
          # 更新说明 = 附注 tag 消息（发版约定 = git tag -a，消息写更新要点；
          # 2026-08-23 前为固定模板句——Release 页长期只有「构建/测试通过」
          # 一行的根因）。v1.0.0 发版实测三坑存档：
          # ① 新版 gh 禁止 --notes-from-tag 与 --repo 组合——不要带 --repo；
          # ② actions/checkout 把 tag push 的同名 tag 落成「指向提交的轻量
          #    tag」（不取附注对象），gh --notes-from-tag 从本地读到的是
          #    提交消息而非附注——v1.0.0 Release 正文变成 CI 提交消息的根因；
          # ③ 本地已有同名 tag 后再 git fetch 同名 tag 会报 would clobber
          #    （对象不同被拒）——所以要拿附注必须 --force 重取 tag 对象。
          # 因此：--force 取回附注 → 导出附注为 notes 文件 → --notes-file
          #（不依赖 gh 对本地 tag 状态的任何假设）。
          git fetch origin tag "$GITHUB_REF_NAME" --force
          git tag -l "$GITHUB_REF_NAME" --format='%(contents)' > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-kimi-tide v${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dsh-kimi-tide-*.tgz
