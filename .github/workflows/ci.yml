name: CI

on:
  push:
    branches: [main]
  pull_request:

# CodeQL actions/missing-workflow-permissions（告警 #3，2026-08-23）：
# 显式最小权限——本工作流只 checkout + 构建测试，contents: read 足矣。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 版本窗证据（2026-08-23 CI 失败溯源 run 32626535333）：jsdom@30
        # engines ^22.22.2 || ^24.15.0、undici@8.10 engines >=22.19.0——undici
        # webidl/index.js:5 从 node:worker_threads 解构 markAsUncloneable，
        # Node 20 无此 API（nodejs/node#55234），jsdom worker 启动即炸。
        # 22 = release.yml 发版环境；24 = 本地开发版本 + GHA runner 默认
        # （Node 20 已被 GHA 弃用）。插件运行时对旧 Node 的兼容由
        # boundedSignal/usage 超时的降级分支承担，与本矩阵无涉。
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/dsh-kimi-tide/package-lock.json
      - name: Docs consistency (changelog/README/package version + doc links)
        run: |
          node scripts/check-changelog.mjs
          node scripts/check-doc-links.mjs
      - run: npm ci
        working-directory: packages/dsh-kimi-tide
      - name: Typecheck
        working-directory: packages/dsh-kimi-tide
        run: npm run typecheck
      - name: Build
        working-directory: packages/dsh-kimi-tide
        run: npm run build
      - name: Test
        working-directory: packages/dsh-kimi-tide
        run: npm test
