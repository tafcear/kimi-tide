# Bundle patch layer for dsh-kimi-bridge.
# Applied when a profile lists this bundle (dsh plugin --profile <name> add .).
# A patch replaces a row's whole config; rows are addressed by id, later
# layers win. Reference: docs/user/develop/basic/publish.md in the harness.
- insert:
    - id: dsh-kimi-bridge
      name: dsh-kimi-bridge
      config:
        kimiPath: kimi             # kimi executable: absolute path or PATH lookup
        reviewOnly: true          # run kimi under a managed read-only [tools] home (default; do not call it a sandbox)
        kimiHome: ''              # source Kimi home for config/auth ('' = KIMI_CODE_HOME, else ~/.kimi-code)
        reviewHomeDir: ''         # managed review home ('' = $DSH_HOME/kimi-review-home)
        maxTimeoutMs: 1800000     # hard cap on any session timeout (30 min)
        defaultTimeoutMs: 600000  # default lifetime per kimi session (10 min; kimi print can wait ~25 days otherwise)
        maxParallel: 3            # global concurrent kimi processes
        maxSessionsPerSession: 8  # live kimi sessions per dsh session
        maxRetained: 16           # retained (settled) records per dsh session
        maxPromptChars: 16384     # prompt length cap (argv prompt; NUL rejected; longer prompts are rejected)
        maxTranscriptChars: 16384 # transcript cap recorded in events/projections
        maxLoopSteps: 32             # bounded agent-loop window (steps kept in record/projection)
        maxLoopBytes: 16384       # serialized-byte cap for the loop window (UTF-8)
        allowedAgents: roots      # who may call call_kimi: roots | all
        killGraceMs: 10000        # SIGTERM -> SIGKILL grace (kimi headless cleanup takes up to 8s)
